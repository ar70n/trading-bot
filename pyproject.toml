[project]
name = "tradingbot"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", ".claude/hooks"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
# bridge.py y monitor.py son legado inactivo (monitor está comentado en bot.py).
extend-exclude = ["src/bridge.py", "src/monitor.py", "installers", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", ".claude/hooks", "scripts", "ops"]
exclude = ["src/bridge\\.py$", "src/monitor\\.py$"]
mypy_path = "src:tests:.claude/hooks"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
